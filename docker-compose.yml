version: '3.8'

services:
  # Serviço do Banco de Dados (MariaDB)
  db:
    image: mariadb:10.6
    container_name: gatepass-db
    restart: unless-stopped
    tty: true
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD} # Senha de root, importante para alguns scripts
    volumes:
      - ./db_data:/var/lib/mysql # Persiste os dados do banco na pasta db_data
    networks:
      - gatepass-network
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # Serviço da Aplicação (PHP-FPM)
  php:
    build:
      context: ./backend # Usa o Dockerfile dentro da pasta backend
    container_name: gatepass-php
    restart: unless-stopped
    env_file:
      - ./.env
    volumes:
      - ./backend:/var/www/html # Mapeia o código da sua API para dentro do container
    networks:
      - gatepass-network
    depends_on:
      db:
        condition: service_healthy # Espera o banco de dados estar saudável antes de iniciar

  # Serviço do Servidor Web (Nginx)
  nginx:
    image: nginx:latest
    container_name: gatepass-nginx
    restart: unless-stopped
    ports:
      - "8081:80" # Expõe a porta 80 do container na porta 80 da sua máquina
    volumes:
      - ./backend:/var/www/html # Mapeia a pasta backend
      - ./frontend:/var/www/html/frontend # Mapeia a pasta frontend
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf # Usa nosso arquivo de configuração customizado
    networks:
      - gatepass-network
    depends_on:
      - php

# Define a rede que nossos containers usarão para se comunicar
networks:
  gatepass-network:
    driver: bridge
