services:
  # Serviço Nginx (Front-end + Proxy reverso)
  nginx:
    # Aparentemente, isso já está funcionando
    image: docker.io/nginx:1.21-alpine
    ports:
      - "80:80"
    volumes:
      - ./frontend/build:/var/www/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php

  # Serviço PHP-FPM (Back-end da API)
  php:
    build:
      context: ./backend
      dockerfile: Dockerfile
    volumes:
      - ./backend:/var/www/html
    working_dir: /var/www/html
    depends_on:
      - db

  # Serviço de Banco de Dados MariaDB
  db:
    # Baixa explicitamente do Docker Hub
    image: docker.io/mariadb:10.6
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-super_secure_root_password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-gatepass_db}
      MYSQL_USER: ${MYSQL_USER:-gatepass_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-gatepass_password}
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data: